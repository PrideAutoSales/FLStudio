name: Build Cruz Opto and Cruz FET

on:
  push:
    branches: [main]
    paths:
      - "plugins/CruzOpto/**"
      - "plugins/CruzFET/**"
      - "plugins/CruzCompShared/**"
      - ".github/workflows/build-compressors.yml"
  pull_request:
    paths:
      - "plugins/CruzOpto/**"
      - "plugins/CruzFET/**"
      - "plugins/CruzCompShared/**"
      - ".github/workflows/build-compressors.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGINVAL_VERSION: v1.0.4

jobs:
  build-mac:
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: CruzOpto
            name: Cruz Opto
            code: Crla
          - target: CruzFET
            name: Cruz FET
            code: Crfe

    env:
      TARGET: ${{ matrix.target }}
      PLUGIN_NAME: ${{ matrix.name }}
      ARTEFACTS: build/plugins/${{ matrix.target }}/${{ matrix.target }}_artefacts/Release

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel 4 --target "${TARGET}_All"

      - name: Sign (ad hoc)
        run: |
          codesign --force --deep --sign - "$ARTEFACTS/VST3/$PLUGIN_NAME.vst3"
          codesign --force --deep --sign - "$ARTEFACTS/AU/$PLUGIN_NAME.component"

      - name: Validate VST3 (pluginval)
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/pluginval_macOS.zip"
          unzip -q pluginval.zip
          pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --validate "$ARTEFACTS/VST3/$PLUGIN_NAME.vst3"

      - name: Validate AU (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$ARTEFACTS/AU/$PLUGIN_NAME.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx ${{ matrix.code }} Cruz

      - name: Package
        run: |
          mkdir -p "dist/${TARGET}-mac"
          cp -R "$ARTEFACTS/VST3/$PLUGIN_NAME.vst3" "$ARTEFACTS/AU/$PLUGIN_NAME.component" "dist/${TARGET}-mac/"
          cp plugins/CruzCompShared/packaging/install.sh "plugins/${TARGET}/INSTALL.md" "dist/${TARGET}-mac/"
          cd dist && ditto -c -k --sequesterRsrc --keepParent "${TARGET}-mac" "${TARGET}-mac.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-mac
          path: dist/${{ matrix.target }}-mac.zip

      - name: Add to "Latest build" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest || gh release create latest --target "$GITHUB_SHA" --title "Latest build" \
            --notes "Built automatically. Each plugin has its own zip with install steps inside."
          gh release upload latest "dist/${TARGET}-mac.zip" --clobber
