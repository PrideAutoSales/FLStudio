name: Build Cruz Echo

on:
  push:
    branches: [main]
    paths:
      - "plugins/CruzEcho/**"
      - "CMakeLists.txt"
      - ".github/workflows/build-cruz-echo.yml"
  pull_request:
    paths:
      - "plugins/CruzEcho/**"
      - "CMakeLists.txt"
      - ".github/workflows/build-cruz-echo.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGIN_NAME: Cruz Echo
  ARTEFACTS: build/plugins/CruzEcho/CruzEcho_artefacts/Release
  PLUGINVAL_VERSION: v1.0.4

jobs:
  build-mac:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Engine tests
        run: |
          cmake --build build --config Release --target CruzEchoEngineTest
          build/plugins/CruzEcho/CruzEchoEngineTest

      - name: Build
        run: cmake --build build --config Release --target CruzEcho_All --parallel 4

      - name: Sign (ad hoc)
        run: |
          codesign --force --deep --sign - "$ARTEFACTS/VST3/$PLUGIN_NAME.vst3"
          codesign --force --deep --sign - "$ARTEFACTS/AU/$PLUGIN_NAME.component"

      - name: Validate VST3 (pluginval)
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/pluginval_macOS.zip"
          unzip -q pluginval.zip
          pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --validate "$ARTEFACTS/VST3/$PLUGIN_NAME.vst3"

      - name: Validate AU (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$ARTEFACTS/AU/$PLUGIN_NAME.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Crdy Cruz

      - name: Package
        run: |
          mkdir -p dist/CruzEcho-mac
          cp -R "$ARTEFACTS/VST3/$PLUGIN_NAME.vst3" "$ARTEFACTS/AU/$PLUGIN_NAME.component" dist/CruzEcho-mac/
          cp plugins/CruzEcho/packaging/install.sh plugins/CruzEcho/INSTALL.md dist/CruzEcho-mac/
          cd dist && ditto -c -k --sequesterRsrc --keepParent CruzEcho-mac CruzEcho-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: CruzEcho-mac
          path: dist/CruzEcho-mac.zip

      - name: Add to the "Latest build" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest || gh release create latest \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Built automatically. Each plugin has its own zip, with install steps in INSTALL.md inside it."
          gh release upload latest dist/CruzEcho-mac.zip --clobber
