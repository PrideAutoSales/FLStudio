name: Build Cruz EQ (Mac)

on:
  push:
    branches: [main]
    paths: ["Source/**", "Tests/**", "packaging/**", "docs/INSTALL.md", "CMakeLists.txt", ".github/workflows/build-cruz-eq.yml"]
  pull_request:
    paths: ["Source/**", "Tests/**", "packaging/**", "docs/INSTALL.md", "CMakeLists.txt", ".github/workflows/build-cruz-eq.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGIN_NAME: Cruz EQ
  ARTEFACTS: build/CruzEQ_artefacts/Release
  PLUGINVAL_VERSION: v1.0.4

jobs:
  build-mac:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel 4 --target CruzEQ_All CruzEQTests

      - name: Test the EQ engine
        run: ctest --test-dir build --output-on-failure -R dsp

      - name: Sign (ad hoc)
        run: |
          codesign --force --deep --sign - "$ARTEFACTS/VST3/$PLUGIN_NAME.vst3"
          codesign --force --deep --sign - "$ARTEFACTS/AU/$PLUGIN_NAME.component"

      - name: Validate VST3 (pluginval)
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/pluginval_macOS.zip"
          unzip -q pluginval.zip
          pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --validate "$ARTEFACTS/VST3/$PLUGIN_NAME.vst3"

      - name: Validate AU (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$ARTEFACTS/AU/$PLUGIN_NAME.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Creq Cruz

      - name: Package
        run: |
          mkdir -p dist/CruzEQ-mac
          cp -R "$ARTEFACTS/VST3/$PLUGIN_NAME.vst3" "$ARTEFACTS/AU/$PLUGIN_NAME.component" dist/CruzEQ-mac/
          cp packaging/install.sh docs/INSTALL.md dist/CruzEQ-mac/
          cd dist && ditto -c -k --sequesterRsrc --keepParent CruzEQ-mac CruzEQ-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: CruzEQ-mac
          path: dist/CruzEQ-mac.zip

      - name: Publish "Latest build" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Other plugins share this release, so only replace our own zip.
          gh release view latest > /dev/null 2>&1 || gh release create latest \
            --target "$GITHUB_SHA" \
            --title "Latest builds" \
            --notes "Each plugin's newest Mac build. Install steps are in INSTALL.md inside each zip." || true
          gh release upload latest dist/CruzEQ-mac.zip --clobber
