name: Build Cruz Synth

on:
  push:
    branches: [main]
    paths:
      - "plugins/CruzSynth/**"
      - ".github/workflows/build-cruzsynth.yml"
  pull_request:
    paths:
      - "plugins/CruzSynth/**"
      - ".github/workflows/build-cruzsynth.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGIN_NAME: Cruz Synth
  ZIP_NAME: CruzSynth-mac
  ARTEFACTS: build/plugins/CruzSynth/CruzSynth_artefacts/Release
  PLUGINVAL_VERSION: v1.0.4

jobs:
  build-mac:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --target CruzSynth_All --parallel 4

      - name: Sign (ad hoc)
        run: |
          codesign --force --deep --sign - "$ARTEFACTS/VST3/$PLUGIN_NAME.vst3"
          codesign --force --deep --sign - "$ARTEFACTS/AU/$PLUGIN_NAME.component"

      - name: Validate VST3 (pluginval)
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/pluginval_macOS.zip"
          unzip -q pluginval.zip
          pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --validate "$ARTEFACTS/VST3/$PLUGIN_NAME.vst3"

      - name: Validate AU (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$ARTEFACTS/AU/$PLUGIN_NAME.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Crsy Cruz

      - name: Package
        run: |
          mkdir -p "dist/$ZIP_NAME"
          cp -R "$ARTEFACTS/VST3/$PLUGIN_NAME.vst3" "$ARTEFACTS/AU/$PLUGIN_NAME.component" "dist/$ZIP_NAME/"
          cp plugins/CruzSynth/packaging/install.sh plugins/CruzSynth/INSTALL.md "dist/$ZIP_NAME/"
          cd dist && ditto -c -k --sequesterRsrc --keepParent "$ZIP_NAME" "$ZIP_NAME.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: dist/${{ env.ZIP_NAME }}.zip

      - name: Add to "Latest builds" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Other plugins share this release, so only replace our own zip.
          gh release view latest > /dev/null 2>&1 || gh release create latest \
            --target "$GITHUB_SHA" \
            --title "Latest builds" \
            --notes "Each plugin's newest Mac build. Install steps are in INSTALL.md inside each zip." || true
          gh release upload latest "dist/$ZIP_NAME.zip" --clobber
